# Railway service config for @qiju/server.
#
# In the Railway dashboard, keep this service's "Root Directory" at the repo
# root (monorepo checkout) and set "Custom Config File Path" to
# apps/server/railway.toml. That way build/start commands below run with the
# full pnpm workspace on disk (this service depends on several workspace
# packages under packages/*).
#
# Required environment variables (set in the Railway dashboard, not here):
#   NODE_ENV=production
#   COOKIE_SECRET=<32+ char random secret>
#   CORS_ORIGIN=https://<frontend-domain>        (e.g. Cloudflare Pages domain)
#   COOKIE_DOMAIN=<shared parent domain>          (optional, e.g. .example.com)
#   PORT=3000                                     (see note below)
#
# PORT is set explicitly rather than relying on Railway's injected value. The
# custom domain routes to a fixed target port, and an injected PORT that
# disagrees with it produces a 502 while the container itself looks perfectly
# healthy — the edge and the app are simply pointed at different ports.
#
# THE-36: watch paths must cover not just apps/server/** but every
# workspace package the server builds from (packages/*) plus root files
# that affect the build. The dashboard-only single pattern /apps/server/**
# silently SKIPPED every packages-only change (THE-9 and THE-35 never
# reached production; players saw literal `hud.analyst`/`hud.budget` keys).
#
# UNPROVEN: whether config-as-code `watchPatterns` overrides the dashboard
# "Watch Paths" setting is not confirmed by Railway's docs. This block is
# landed as the versioned intent; it must be proven empirically after merge
# (push a packages-only change, confirm a deployment triggers). If Railway
# ignores it, the dashboard setting must be widened to match.

watchPatterns = ["/apps/server/**", "/packages/**", "/package.json", "/pnpm-lock.yaml", "/pnpm-workspace.yaml", "/tsconfig.base.json"]

[build]
builder = "NIXPACKS"
# --prod=false is required: NODE_ENV=production is set as a service variable
# (the server needs it at runtime for Secure/SameSite=None cookies), and pnpm
# otherwise skips devDependencies — which is where typescript lives, so `tsc`
# would not exist at build time.
#
# --config.confirmModulesPurge=false is required alongside it: if the builder
# has already run a prod-only install, switching to a full install needs to
# purge node_modules. That purge asks for confirmation, and when unanswered
# pnpm exits 0 WITHOUT installing devDependencies — a silent no-op that fails
# later at `tsc: command not found`. This flag makes the purge unattended.
buildCommand = "pnpm install --frozen-lockfile --prod=false --config.confirmModulesPurge=false && pnpm --filter @qiju/server... run build"

[deploy]
startCommand = "node apps/server/dist/main.js"
healthcheckPath = "/health/live"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
